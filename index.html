<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Pro</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
<h1>🧠 Flashcards Pro</h1>
<button id="themeToggle">🌙</button>
</header>

<div class="controls">

<input type="text" id="question" placeholder="Enter question">
<input type="text" id="answer" placeholder="Enter answer">

<select id="category">
<option value="General">General</option>
<option value="Programming">Programming</option>
<option value="Science">Science</option>
<option value="Math">Math</option>
</select>

<button onclick="addCard()">Add Card</button>
<button onclick="generateAI()">AI Generate</button>

<input type="text" id="search" placeholder="Search flashcards...">

</div>

<div class="features">

    <button onclick="startQuiz()">Start Study Quiz</button>
    <button onclick="exportCards()">Export Cards</button>
    <input type="file" id="importFile">
    
    </div>

<div class="stats">
<p>Total Cards: <span id="totalCards">0</span></p>
<p>Correct: <span id="correct">0</span></p>
<p>Wrong: <span id="wrong">0</span></p>
</div>

<canvas id="progressChart"></canvas>

<div id="quizContainer"></div>

<div id="cardsContainer" class="cards"></div>

<script src="script.js"></script>
</body>
</html>
